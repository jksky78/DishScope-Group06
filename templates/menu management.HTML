<!DOCTYPE html>
<html>
<head>
    <title>Menu Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        h1 { color: #333; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .header-actions { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stats { background: #e9ecef; padding: 10px 15px; border-radius: 4px; display: inline-block; margin: 0; }
        .stats span { margin-right: 20px; font-weight: bold; }
        
        .btn-primary, button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
        .btn-primary:hover, button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #a71d2a; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }

        /* Card Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .dish-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .dish-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; background: #eee; margin-bottom: 10px; }
        .dish-card h3 { margin: 5px 0; font-size: 16px; color: #333; }
        .dish-card .price { font-weight: bold; color: #007bff; margin-bottom: 5px; }
        .dish-card .vendor { font-size: 12px; color: #666; margin-bottom: 5px; }
        .dish-card .status { font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .status.available { color: green; }
        .status.unavailable { color: red; }
        .card-actions { display: flex; gap: 5px; justify-content: center; }
        .card-actions button { padding: 6px 12px; font-size: 13px; }

        /* Edit Form Section */
        #editSection { display: none; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        #editSection h2 { font-size: 18px; color: #333; margin-bottom: 15px; }
        .edit-layout { display: flex; gap: 30px; }
        .edit-left { flex: 1; }
        .edit-right { width: 250px; display: flex; flex-direction: column; align-items: center; border-left: 1px solid #eee; padding-left: 20px; }
        .edit-right label { font-weight: bold; margin-bottom: 10px; display: block; text-align: left; width: 100%; }
        .image-preview-box { width: 150px; height: 150px; border: 2px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; background: #fafafa; }
        .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .edit-right input[type="file"] { display: none; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; }
        .form-group label { width: 140px; font-weight: bold; font-size: 14px; }
        .form-group input[type="text"], .form-group input[type="number"], .form-group select { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .health-info-title { margin-top: 20px; margin-bottom: 10px; font-size: 16px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        /* Form Actions */
        .form-actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 15px; }
        .form-actions-left { display: flex; gap: 10px; }
        .form-actions button { padding: 10px 20px; font-size: 14px; }

        /* Details Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .modal-content .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #888; background: none; border: none; padding: 0; }
        .modal-content .close-btn:hover { color: #000; }
        .detail-row { margin-bottom: 10px; font-size: 14px; display: flex; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .detail-row strong { width: 140px; display: inline-block; color: #555; }
        .detail-row span { flex: 1; color: #333; }
        .modal-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Menu Management</h1>

    <div class="header-actions">
        <div class="stats">
            <span>Total: <span id="total">0</span></span>
            <span>Available: <span id="available">0</span></span>
            <span>Unavailable: <span id="unavailable">0</span></span>
        </div>
        <a href="dish-registration.html" class="btn-primary">+ Add New Dish</a>
    </div>

    <!-- Card Grid -->
    <div class="menu-grid" id="menuGrid"></div>

    <!-- Edit Form Section -->
    <div id="editSection">
        <h2>Edit Dish (for vendor only)</h2>
        <form id="editDishForm">
            <input type="hidden" id="editId">
            <div class="edit-layout">
                <div class="edit-left">
                    <div class="form-group"><label>Dish name:</label><input type="text" id="editName" required></div>
                    <div class="form-group"><label>Category:</label>
                        <select id="editCategory"><option value="Main">Main</option><option value="Appetizer">Appetizer</option><option value="Dessert">Dessert</option><option value="Drink">Drink</option></select>
                    </div>
                    <div class="form-group"><label>Price (RM):</label><input type="number" id="editPrice" step="0.01" min="0" required></div>
                    <div class="form-group"><label>Description:</label><input type="text" id="editDescription"></div>
                    <div class="health-info-title">Basic health information:</div>
                    <div class="form-group"><label>Calories:</label><input type="text" id="editCalories"></div>
                    <div class="form-group"><label>Ingredients:</label><input type="text" id="editIngredients"></div>
                    <div class="form-group"><label>Vegetarian status:</label>
                        <select id="editVegetarian"><option value="Yes">Yes</option><option value="No">No</option></select>
                    </div>
                    <div class="form-group"><label>Spicy level:</label>
                        <select id="editSpicy"><option value="Not spicy">Not spicy</option><option value="Mild">Mild</option><option value="Medium">Medium</option><option value="Extra Spicy">Extra Spicy</option></select>
                    </div>
                    <div class="form-group"><label>Allergens:</label><input type="text" id="editAllergens"></div>
                    <div class="form-group"><label>Availability:</label>
                        <select id="editAvailable"><option value="true">Yes</option><option value="false">No</option></select>
                    </div>
                </div>
                <div class="edit-right">
                    <label>Current image:</label>
                    <div class="image-preview-box"><img id="editImagePreview" src="https://via.placeholder.com/150" alt="Preview"></div>
                    <input type="file" id="editImageUpload" accept="image/*">
                    <button type="button" class="secondary" onclick="document.getElementById('editImageUpload').click()" style="margin-bottom: 10px;">Upload Image</button>
                </div>
            </div>
            
            <!-- UPDATED: Form Actions with Delete button -->
            <div class="form-actions">
                <div class="form-actions-left">
                    <button type="submit" class="success">Save changes</button>
                    <button type="button" class="secondary" onclick="hideEditForm()">Discard changes</button>
                </div>
                <button type="button" class="danger" onclick="deleteDishFromForm()">Delete Dish</button>
            </div>
        </form>
    </div>
</div>

<!-- Details Modal -->
<div id="detailsModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" onclick="closeDetailsModal()">&times;</button>
        <h2 id="modalDishName">Dish Details</h2>
        <img id="modalDishImage" class="modal-img" src="https://via.placeholder.com/150" alt="Dish Image">
        
        <div class="detail-row"><strong>Category:</strong> <span id="modalCategory"></span></div>
        <div class="detail-row"><strong>Price:</strong> <span id="modalPrice"></span></div>
        <div class="detail-row"><strong>Vendor:</strong> <span id="modalVendor"></span></div>
        <div class="detail-row"><strong>Description:</strong> <span id="modalDescription"></span></div>
        
        <h3 style="margin-top:20px; font-size:16px;">Health Information</h3>
        <div class="detail-row"><strong>Calories:</strong> <span id="modalCalories"></span></div>
        <div class="detail-row"><strong>Ingredients:</strong> <span id="modalIngredients"></span></div>
        <div class="detail-row"><strong>Vegetarian:</strong> <span id="modalVegetarian"></span></div>
        <div class="detail-row"><strong>Spicy Level:</strong> <span id="modalSpicy"></span></div>
        <div class="detail-row"><strong>Allergens:</strong> <span id="modalAllergens"></span></div>
    </div>
</div>

<script>
    var dishes = [];
    var editId = null;

    function loadData() {
        var stored = localStorage.getItem('menuDraft');
        if (stored) {
            dishes = JSON.parse(stored);
            dishes = dishes.map(function(d) {
                return {
                    id: d.id, name: d.name || '', category: d.category || 'Main', price: d.price || 0,
                    vendor: d.vendor || '', available: d.available !== undefined ? d.available : true,
                    description: d.description || '', calories: d.calories || '', ingredients: d.ingredients || '',
                    vegetarian: d.vegetarian || 'No', spiciness: d.spiciness || 'Not spicy',
                    allergens: d.allergens || '', image: d.image || 'https://via.placeholder.com/150'
                };
            });
        } else {
            dishes = [
                { id: '1', name: 'Margherita Pizza', category: 'Main', price: 14.99, vendor: 'Chicken Delight', available: true, description: 'Classic pizza with tomato and mozzarella', calories: '800', ingredients: 'Flour, Tomato, Mozzarella, Basil', vegetarian: 'Yes', spiciness: 'Not spicy', allergens: 'Gluten, Dairy', image: 'https://via.placeholder.com/150' },
                { id: '2', name: 'Tiramisu', category: 'Dessert', price: 8.25, vendor: 'Bella Italia', available: false, description: 'Coffee-flavored Italian dessert', calories: '450', ingredients: 'Mascarpone, Coffee, Cocoa', vegetarian: 'Yes', spiciness: 'Not spicy', allergens: 'Dairy, Eggs', image: 'https://via.placeholder.com/150' }
            ];
            saveData();
        }
        renderGrid();
    }

    function saveData() { localStorage.setItem('menuDraft', JSON.stringify(dishes)); }

    function updateStats() {
        var total = dishes.length;
        var available = 0;
        for (var i = 0; i < dishes.length; i++) { if (dishes[i].available) available++; }
        document.getElementById('total').innerHTML = total;
        document.getElementById('available').innerHTML = available;
        document.getElementById('unavailable').innerHTML = total - available;
    }

    // UPDATED: renderGrid only has Details and Edit buttons
    function renderGrid() {
        var grid = document.getElementById('menuGrid');
        var html = '';
        if (dishes.length === 0) {
            html = '<p style="text-align:center; width:100%; color:#666;">No dishes found.</p>';
        } else {
            for (var i = 0; i < dishes.length; i++) {
                var d = dishes[i];
                var statusClass = d.available ? 'available' : 'unavailable';
                var statusText = d.available ? 'Available' : 'Unavailable';
                
                html += '<div class="dish-card">';
                html += '<img src="' + d.image + '" alt="' + d.name + '">';
                html += '<h3>' + d.name + '</h3>';
                html += '<div class="price">$' + parseFloat(d.price).toFixed(2) + '</div>';
                html += '<div class="vendor">' + d.vendor + '</div>';
                html += '<div class="status ' + statusClass + '">' + statusText + '</div>';
                html += '<div class="card-actions">';
                html += '<button onclick="viewDetails(\'' + d.id + '\')" class="success">Details</button>';
                html += '<button onclick="editDish(\'' + d.id + '\')">Edit</button>';
                html += '</div>';
                html += '</div>';
            }
        }
        grid.innerHTML = html;
        updateStats();
    }

    function viewDetails(id) {
        var dish = dishes.find(function(d) { return d.id == id; });
        if (!dish) return;

        document.getElementById('modalDishName').innerText = dish.name;
        document.getElementById('modalDishImage').src = dish.image || 'https://via.placeholder.com/150';
        document.getElementById('modalCategory').innerText = dish.category;
        document.getElementById('modalPrice').innerText = '$' + parseFloat(dish.price).toFixed(2);
        document.getElementById('modalVendor').innerText = dish.vendor;
        document.getElementById('modalDescription').innerText = dish.description || 'No description provided.';
        document.getElementById('modalCalories').innerText = dish.calories || 'N/A';
        document.getElementById('modalIngredients').innerText = dish.ingredients || 'N/A';
        document.getElementById('modalVegetarian').innerText = dish.vegetarian;
        document.getElementById('modalSpicy').innerText = dish.spiciness;
        document.getElementById('modalAllergens').innerText = dish.allergens || 'N/A';

        document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeDetailsModal() {
        document.getElementById('detailsModal').style.display = 'none';
    }

    function editDish(id) {
        var dish = dishes.find(function(d) { return d.id == id; });
        if (!dish) return;

        editId = id;
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = dish.name;
        document.getElementById('editCategory').value = dish.category;
        document.getElementById('editPrice').value = dish.price;
        document.getElementById('editDescription').value = dish.description || '';
        document.getElementById('editCalories').value = dish.calories || '';
        document.getElementById('editIngredients').value = dish.ingredients || '';
        document.getElementById('editVegetarian').value = dish.vegetarian || 'No';
        document.getElementById('editSpicy').value = dish.spiciness || 'Not spicy';
        document.getElementById('editAllergens').value = dish.allergens || '';
        document.getElementById('editAvailable').value = dish.available.toString();
        document.getElementById('editImagePreview').src = dish.image || 'https://via.placeholder.com/150';

        document.getElementById('editSection').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function hideEditForm() {
        editId = null;
        document.getElementById('editSection').style.display = 'none';
        document.getElementById('editDishForm').reset();
        document.getElementById('editImagePreview').src = 'https://via.placeholder.com/150';
    }

    // NEW: Function to handle delete directly from the edit form
    function deleteDishFromForm() {
        if (!editId) return;
        if (confirm('Are you sure you want to delete this dish? This cannot be undone.')) {
            // Filter out the dish
            dishes = dishes.filter(function(d) { return d.id != editId; });
            saveData();
            renderGrid();
            hideEditForm();
        }
    }

    document.getElementById('editImageUpload').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function(event) { document.getElementById('editImagePreview').src = event.target.result; };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('editDishForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var id = document.getElementById('editId').value;
        if (!id) return;

        var name = document.getElementById('editName').value.trim();
        var category = document.getElementById('editCategory').value;
        var price = parseFloat(document.getElementById('editPrice').value);
        var description = document.getElementById('editDescription').value.trim();
        var calories = document.getElementById('editCalories').value.trim();
        var ingredients = document.getElementById('editIngredients').value.trim();
        var vegetarian = document.getElementById('editVegetarian').value;
        var spiciness = document.getElementById('editSpicy').value;
        var allergens = document.getElementById('editAllergens').value.trim();
        var available = document.getElementById('editAvailable').value === 'true';
        var currentImage = document.getElementById('editImagePreview').src;

        if (!name || isNaN(price) || price < 0) { alert('Please fill all required fields correctly.'); return; }

        for (var i = 0; i < dishes.length; i++) {
            if (dishes[i].id == id) {
                dishes[i].name = name; dishes[i].category = category; dishes[i].price = price;
                dishes[i].description = description; dishes[i].calories = calories; dishes[i].ingredients = ingredients;
                dishes[i].vegetarian = vegetarian; dishes[i].spiciness = spiciness; dishes[i].allergens = allergens;
                dishes[i].available = available; dishes[i].image = currentImage; break;
            }
        }

        saveData(); renderGrid(); hideEditForm();
    });

    loadData();
</script>

</body>
</html>

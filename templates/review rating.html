<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Menu Management</title>
    <style>
        /* ============================================================
           GLOBAL STYLES – matching menu management
           ============================================================ */
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f9f9f9;
            color: #333;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* --- buttons --- */
        .btn-primary, button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            font-family: inherit;
        }
        .btn-primary:hover, button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #a71d2a; }
        button.small { padding: 5px 10px; font-size: 12px; }

        /* --- header nav --- */
        .header-actions {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links { display: flex; gap: 8px; }

        /* ============================================================
           KPI ROW
           ============================================================ */
        .kpi-row {
            background: #e9ecef;
            padding: 12px 18px;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-bottom: 24px;
        }
        .kpi-item { font-size: 14px; color: #495057; }
        .kpi-item strong {
            font-weight: bold;
            color: #212529;
            margin-left: 4px;
        }

        /* ============================================================
           PANEL LAYOUT
           ============================================================ */
        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (max-width: 850px) {
            .panel-grid { grid-template-columns: 1fr; }
        }

        .panel {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px 18px;
            background: #fff;
        }
        .panel h2 {
            font-size: 16px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel h2 .sub {
            font-size: 12px;
            font-weight: normal;
            color: #6c757d;
        }

        /* ============================================================
           REVIEW FORM
           ============================================================ */
        .form-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 110px;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }
        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        .form-group textarea { min-height: 60px; }

        /* --- star input --- */
        .star-input {
            display: flex;
            gap: 4px;
            user-select: none;
        }
        .star-input span {
            font-size: 24px;
            color: #ddd;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s;
        }
        .star-input span.active { color: #f5b342; }
        .star-input span:hover { color: #f5b342; }

        .review-form-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            padding-left: 110px;
        }

        /* ============================================================
           REVIEWS LIST
           ============================================================ */
        .reviews-list { max-height: 380px; overflow-y: auto; }
        .review-card {
            border-bottom: 1px solid #f2f2f2;
            padding: 12px 0;
        }
        .review-card:last-child { border-bottom: none; }

        .review-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 5px;
        }
        .review-user {
            font-weight: bold;
            font-size: 13px;
            color: #212529;
        }
        .review-dish {
            font-size: 12px;
            color: #007bff;
            margin-left: 6px;
        }
        .review-stars {
            color: #f5b342;
            font-size: 13px;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .review-body {
            font-size: 13px;
            color: #495057;
            line-height: 1.5;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .review-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #adb5bd;
        }
        .review-actions { display: flex; gap: 6px; }

        /* ============================================================
           TOP DISHES LIST
           ============================================================ */
        .dish-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f2f2f2;
        }
        .dish-row:last-child { border-bottom: none; }
        .dish-row .rank {
            width: 22px;
            font-size: 13px;
            font-weight: bold;
            color: #adb5bd;
            text-align: center;
        }
        .dish-row .rank.top { color: #f0ad4e; }
        .dish-row img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            background: #eee;
        }
        .dish-row .info { flex: 1; min-width: 0; }
        .dish-row .info .name {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dish-row .info .meta {
            font-size: 12px;
            color: #6c757d;
            margin-top: 2px;
        }
        .dish-row .score { text-align: right; flex-shrink: 0; }
        .dish-row .score .stars {
            color: #f5b342;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .dish-row .score .num {
            font-size: 13px;
            font-weight: bold;
            color: #212529;
            margin-left: 3px;
        }
        .dish-row .score .count {
            font-size: 11px;
            color: #adb5bd;
            display: block;
        }

        /* ============================================================
           ACTIVITY FEED
           ============================================================ */
        .feed-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f2f2f2;
            font-size: 13px;
            line-height: 1.5;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #007bff;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .feed-item .dot.green { background: #28a745; }
        .feed-item .dot.orange { background: #fd7e14; }
        .feed-item .feed-time {
            font-size: 11px;
            color: #adb5bd;
            margin-top: 2px;
        }

        /* ============================================================
           DISTRIBUTION BARS
           ============================================================ */
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .bar-row .label {
            width: 55px;
            color: #495057;
            flex-shrink: 0;
        }
        .bar-row .track {
            flex: 1;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-row .fill {
            height: 100%;
            border-radius: 10px;
            background: #007bff;
        }
        .bar-row .fill.green { background: #28a745; }
        .bar-row .fill.orange { background: #fd7e14; }
        .bar-row .pct {
            width: 34px;
            text-align: right;
            font-weight: bold;
            color: #212529;
            font-size: 12px;
        }

        /* ============================================================
           VENDOR LEADERBOARD
           ============================================================ */
        .vendor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #f2f2f2;
            font-size: 13px;
        }
        .vendor-row:last-child { border-bottom: none; }
        .vendor-row .vname { font-weight: bold; color: #212529; }
        .vendor-row .vright {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .vendor-row .vstars { color: #f5b342; font-size: 13px; }
        .vendor-row .vcount { color: #6c757d; font-size: 12px; }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-actions {
            display: flex;
            gap: 10px;
            padding-top: 18px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
        }

        .empty-note {
            text-align: center;
            color: #999;
            padding: 24px 0;
            font-style: italic;
            font-size: 13px;
        }
        .form-message {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }
        .form-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .form-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <h1>Dashboard</h1>

    <div class="header-actions">
        <div class="nav-links">
            <a href="menu management.html" class="btn-primary">← Back to Menu</a>
            <a href="dish-registration.html" class="btn-primary" style="background:#28a745;">+ Add Dish</a>
        </div>
        <button class="secondary" onclick="renderAll()">Refresh</button>
    </div>

    <!-- ===== KPI ROW ===== -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- ===== ROW 1: Write review + Reviews list ===== -->
    <div class="panel-grid">

        <div class="panel">
            <h2 id="reviewFormTitle">Write a review</h2>
            <div id="formMessage" class="form-message"></div>
            <form id="reviewForm" onsubmit="submitReview(event)">
                <input type="hidden" id="reviewId">

                <div class="form-group">
                    <label>Your name:</label>
                    <input type="text" id="reviewUser" placeholder="e.g. Alex" required maxlength="40">
                </div>

                <div class="form-group">
                    <label>Dish:</label>
                    <select id="reviewDish" required>
                        <option value="">-- Select a dish --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rating:</label>
                    <div class="star-input" id="starInput">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>
                    <input type="hidden" id="reviewRating" required>
                </div>

                <div class="form-group" style="align-items: flex-start;">
                    <label style="padding-top:8px;">Comment:</label>
                    <textarea id="reviewComment" placeholder="How was the dish?" maxlength="300" required></textarea>
                </div>

                <div class="review-form-actions">
                    <button type="submit" class="success" id="submitBtn">Post review</button>
                    <button type="button" class="secondary" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="panel">
            <h2>
                All reviews
                <span class="sub" id="reviewsCount">0 reviews</span>
            </h2>
            <div class="reviews-list" id="reviewsList">
                <p class="empty-note">No reviews yet. Be the first to write one.</p>
            </div>
        </div>
    </div>

    <!-- ===== ROW 2: Top dishes + Activity ===== -->
    <div class="panel-grid">
        <div class="panel">
            <h2>Top rated dishes</h2>
            <div id="topDishesList">
                <p class="empty-note">No ratings yet.</p>
            </div>
        </div>

        <div class="panel">
            <h2>Recent activity</h2>
            <div id="activityFeed">
                <p class="empty-note">No recent activity.</p>
            </div>
        </div>
    </div>

    <!-- ===== ROW 3: Rating breakdown + Vendors ===== -->
    <div class="panel-grid">
        <div class="panel">
            <h2>Rating breakdown</h2>
            <div id="ratingBars">
                <p class="empty-note">No ratings yet.</p>
            </div>
        </div>

        <div class="panel">
            <h2>Vendors by rating</h2>
            <div id="vendorList">
                <p class="empty-note">No vendors yet.</p>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer-actions">
        <button class="secondary" onclick="exportReviews()">Export reviews (JSON)</button>
        <button class="secondary" onclick="clearAllReviews()">Clear all reviews</button>
    </div>

</div>

<script>
    // ============================================================
    // STORAGE KEYS
    // ============================================================
    var DISH_KEY = 'menuDraft';
    var REVIEW_KEY = 'dishReviews';

    // fallback dishes (same as menu management)
    var FALLBACK_DISHES = [
        { id: '1', name: 'Margherita Pizza', category: 'Main', price: 14.99, vendor: 'Chicken Delight', available: true, description: 'Classic pizza with tomato and mozzarella', calories: '800', ingredients: 'Flour, Tomato, Mozzarella, Basil', vegetarian: 'Yes', spiciness: 'Not spicy', allergens: 'Gluten, Dairy', image: 'https://via.placeholder.com/150' },
        { id: '2', name: 'Tiramisu', category: 'Dessert', price: 8.25, vendor: 'Bella Italia', available: false, description: 'Coffee-flavored Italian dessert', calories: '450', ingredients: 'Mascarpone, Coffee, Cocoa', vegetarian: 'Yes', spiciness: 'Not spicy', allergens: 'Dairy, Eggs', image: 'https://via.placeholder.com/150' }
    ];

    // current star value in the form
    var currentRating = 0;

    // ============================================================
    // LOAD / SAVE
    // ============================================================
    function loadDishes() {
        var stored = localStorage.getItem(DISH_KEY);
        if (stored) {
            try {
                var parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            } catch (e) {}
        }
        localStorage.setItem(DISH_KEY, JSON.stringify(FALLBACK_DISHES));
        return FALLBACK_DISHES.slice();
    }

    function loadReviews() {
        var stored = localStorage.getItem(REVIEW_KEY);
        if (stored) {
            try {
                var parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) return parsed;
            } catch (e) {}
        }
        return [];
    }

    function saveReviews(reviews) {
        localStorage.setItem(REVIEW_KEY, JSON.stringify(reviews));
    }

    function getDishById(id) {
        var dishes = loadDishes();
        for (var i = 0; i < dishes.length; i++) {
            if (dishes[i].id == id) return dishes[i];
        }
        return null;
    }

    // ============================================================
    // TIME FORMAT
    // ============================================================
    function timeAgo(iso) {
        var then = new Date(iso).getTime();
        var now = Date.now();
        var diff = Math.max(0, Math.floor((now - then) / 1000));
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
        if (diff < 86400) return Math.floor(diff / 3600) + ' hr ago';
        if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
        return new Date(iso).toLocaleDateString();
    }

    // ============================================================
    // STAR INPUT
    // ============================================================
    function initStarInput() {
        var stars = document.querySelectorAll('#starInput span');
        stars.forEach(function(star) {
            star.addEventListener('mouseenter', function() {
                var val = parseInt(star.dataset.value);
                paintStars(val);
            });
            star.addEventListener('mouseleave', function() {
                paintStars(currentRating);
            });
            star.addEventListener('click', function() {
                currentRating = parseInt(star.dataset.value);
                document.getElementById('reviewRating').value = currentRating;
                paintStars(currentRating);
            });
        });
    }

    function paintStars(upTo) {
        var stars = document.querySelectorAll('#starInput span');
        stars.forEach(function(star) {
            var v = parseInt(star.dataset.value);
            star.classList.toggle('active', v <= upTo);
        });
    }

    function resetStarInput() {
        currentRating = 0;
        document.getElementById('reviewRating').value = '';
        paintStars(0);
    }

    // ============================================================
    // POPULATE DISH DROPDOWN
    // ============================================================
    function populateDishDropdown() {
        var dishes = loadDishes();
        var select = document.getElementById('reviewDish');
        var current = select.value;
        select.innerHTML = '<option value="">-- Select a dish --</option>';
        dishes.forEach(function(d) {
            var opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name + '  (' + (d.vendor || 'unknown') + ')';
            select.appendChild(opt);
        });
        select.value = current;
    }

    // ============================================================
    // FORM SUBMIT (CREATE / UPDATE)
    // ============================================================
    function submitReview(e) {
        e.preventDefault();
        var id = document.getElementById('reviewId').value;
        var user = document.getElementById('reviewUser').value.trim();
        var dishId = document.getElementById('reviewDish').value;
        var rating = parseInt(document.getElementById('reviewRating').value);
        var comment = document.getElementById('reviewComment').value.trim();

        if (!user) { showMessage('Please enter your name.', 'error'); return; }
        if (!dishId) { showMessage('Please pick a dish.', 'error'); return; }
        if (!rating || rating < 1 || rating > 5) { showMessage('Please pick a star rating.', 'error'); return; }
        if (!comment) { showMessage('Please write a short comment.', 'error'); return; }

        var reviews = loadReviews();

        if (id) {
            // update existing
            for (var i = 0; i < reviews.length; i++) {
                if (reviews[i].id === id) {
                    reviews[i].user = user;
                    reviews[i].dishId = dishId;
                    reviews[i].rating = rating;
                    reviews[i].comment = comment;
                    reviews[i].editedAt = new Date().toISOString();
                    break;
                }
            }
            showMessage('Review updated.', 'success');
        } else {
            // create new
            reviews.push({
                id: 'r' + Date.now() + Math.floor(Math.random() * 1000),
                user: user,
                dishId: dishId,
                rating: rating,
                comment: comment,
                createdAt: new Date().toISOString()
            });
            showMessage('Review posted.', 'success');
        }

        saveReviews(reviews);
        cancelEdit();
        renderAll();
    }

    function showMessage(text, type) {
        var box = document.getElementById('formMessage');
        box.textContent = text;
        box.className = 'form-message ' + type;
        setTimeout(function() {
            box.className = 'form-message';
        }, 3000);
    }

    // ============================================================
    // EDIT / DELETE
    // ============================================================
    function editReview(id) {
        var reviews = loadReviews();
        var r = reviews.find(function(x) { return x.id === id; });
        if (!r) return;

        document.getElementById('reviewId').value = r.id;
        document.getElementById('reviewUser').value = r.user;
        document.getElementById('reviewDish').value = r.dishId;
        document.getElementById('reviewComment').value = r.comment;

        currentRating = r.rating;
        document.getElementById('reviewRating').value = r.rating;
        paintStars(r.rating);

        document.getElementById('reviewFormTitle').textContent = 'Edit review';
        document.getElementById('submitBtn').textContent = 'Save changes';
        document.getElementById('cancelBtn').style.display = 'inline-block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        document.getElementById('reviewForm').reset();
        document.getElementById('reviewId').value = '';
        document.getElementById('reviewFormTitle').textContent = 'Write a review';
        document.getElementById('submitBtn').textContent = 'Post review';
        document.getElementById('cancelBtn').style.display = 'none';
        resetStarInput();
        document.getElementById('reviewDish').value = '';
    }

    function deleteReview(id) {
        if (!confirm('Delete this review?')) return;
        var reviews = loadReviews().filter(function(r) { return r.id !== id; });
        saveReviews(reviews);
        // if we were editing this one, reset the form
        if (document.getElementById('reviewId').value === id) cancelEdit();
        renderAll();
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================

    function renderKPIs(reviews) {
        var dishes = loadDishes();
        var totalReviews = reviews.length;
        var avg = '—';
        if (totalReviews > 0) {
            var sum = reviews.reduce(function(s, r) { return s + r.rating; }, 0);
            avg = (sum / totalReviews).toFixed(1) + ' ★';
        }
        var vendors = {};
        dishes.forEach(function(d) { if (d.vendor) vendors[d.vendor] = true; });

        document.getElementById('kpiRow').innerHTML =
            '<div class="kpi-item">Dishes on menu <strong>' + dishes.length + '</strong></div>' +
            '<div class="kpi-item">Average rating <strong>' + avg + '</strong></div>' +
            '<div class="kpi-item">Total reviews <strong>' + totalReviews + '</strong></div>' +
            '<div class="kpi-item">Vendors <strong>' + Object.keys(vendors).length + '</strong></div>';
    }

    function renderReviewsList(reviews) {
        var container = document.getElementById('reviewsList');
        document.getElementById('reviewsCount').textContent =
            reviews.length + ' review' + (reviews.length === 1 ? '' : 's');

        if (!reviews.length) {
            container.innerHTML = '<p class="empty-note">No reviews yet. Be the first to write one.</p>';
            return;
        }

        // newest first
        var sorted = reviews.slice().sort(function(a, b) {
            return new Date(b.editedAt || b.createdAt) - new Date(a.editedAt || a.createdAt);
        });

        var html = '';
        sorted.forEach(function(r) {
            var dish = getDishById(r.dishId);
            var dishName = dish ? dish.name : 'Removed dish';
            var stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
            var when = timeAgo(r.editedAt || r.createdAt);
            var edited = r.editedAt ? ' · edited' : '';

            html +=
                '<div class="review-card">' +
                    '<div class="review-head">' +
                        '<div>' +
                            '<span class="review-user">' + escapeHtml(r.user) + '</span>' +
                            '<span class="review-dish">on ' + escapeHtml(dishName) + '</span>' +
                        '</div>' +
                        '<span class="review-stars">' + stars + '</span>' +
                    '</div>' +
                    '<div class="review-body">' + escapeHtml(r.comment) + '</div>' +
                    '<div class="review-meta">' +
                        '<span>' + when + edited + '</span>' +
                        '<span class="review-actions">' +
                            '<button class="secondary small" onclick="editReview(\'' + r.id + '\')">Edit</button>' +
                            '<button class="danger small" onclick="deleteReview(\'' + r.id + '\')">Delete</button>' +
                        '</span>' +
                    '</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function renderTopDishes(reviews) {
        var container = document.getElementById('topDishesList');
        if (!reviews.length) {
            container.innerHTML = '<p class="empty-note">No ratings yet.</p>';
            return;
        }

        // aggregate by dish
        var map = {};
        reviews.forEach(function(r) {
            if (!map[r.dishId]) map[r.dishId] = { sum: 0, count: 0 };
            map[r.dishId].sum += r.rating;
            map[r.dishId].count += 1;
        });

        var dishes = loadDishes();
        var rows = [];
        Object.keys(map).forEach(function(dishId) {
            var dish = null;
            for (var i = 0; i < dishes.length; i++) { if (dishes[i].id == dishId) { dish = dishes[i]; break; } }
            if (!dish) return;
            rows.push({
                name: dish.name,
                vendor: dish.vendor || '—',
                category: dish.category || '—',
                image: dish.image || 'https://via.placeholder.com/150',
                avg: map[dishId].sum / map[dishId].count,
                count: map[dishId].count
            });
        });
        rows.sort(function(a, b) { return b.avg - a.avg; });

        var html = '';
        rows.slice(0, 5).forEach(function(d, i) {
            var rankClass = i === 0 ? 'top' : '';
            var stars = '★'.repeat(Math.round(d.avg));
            html +=
                '<div class="dish-row">' +
                    '<div class="rank ' + rankClass + '">' + (i + 1) + '</div>' +
                    '<img src="' + d.image + '" alt="' + escapeHtml(d.name) + '">' +
                    '<div class="info">' +
                        '<div class="name">' + escapeHtml(d.name) + '</div>' +
                        '<div class="meta">' + escapeHtml(d.vendor) + ' · ' + escapeHtml(d.category) + '</div>' +
                    '</div>' +
                    '<div class="score">' +
                        '<span class="stars">' + stars + '</span>' +
                        '<span class="num">' + d.avg.toFixed(1) + '</span>' +
                        '<span class="count">' + d.count + ' review' + (d.count === 1 ? '' : 's') + '</span>' +
                    '</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function renderActivity(reviews) {
        var container = document.getElementById('activityFeed');
        if (!reviews.length) {
            container.innerHTML = '<p class="empty-note">No recent activity.</p>';
            return;
        }
        var sorted = reviews.slice().sort(function(a, b) {
            return new Date(b.editedAt || b.createdAt) - new Date(a.editedAt || a.createdAt);
        }).slice(0, 6);

        var html = '';
        sorted.forEach(function(r) {
            var dish = getDishById(r.dishId);
            var dishName = dish ? dish.name : 'a dish';
            var dotClass = r.rating >= 4 ? 'green' : (r.rating <= 2 ? 'orange' : '');
            var verb = r.editedAt ? 'updated their review on' : 'rated';
            var stars = r.rating + '★';

            html +=
                '<div class="feed-item">' +
                    '<div class="dot ' + dotClass + '"></div>' +
                    '<div>' +
                        '<div><b>' + escapeHtml(r.user) + '</b> ' + verb + ' <b>' + escapeHtml(dishName) + '</b> ' + stars + '</div>' +
                        '<div class="feed-time">' + timeAgo(r.editedAt || r.createdAt) + '</div>' +
                    '</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function renderRatingBars(reviews) {
        var container = document.getElementById('ratingBars');
        if (!reviews.length) {
            container.innerHTML = '<p class="empty-note">No ratings yet.</p>';
            return;
        }
        var buckets = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
        reviews.forEach(function(r) {
            var s = Math.max(1, Math.min(5, r.rating));
            buckets[s] += 1;
        });
        var total = reviews.length;

        var html = '';
        [5, 4, 3, 2, 1].forEach(function(star) {
            var count = buckets[star];
            var pct = total > 0 ? Math.round((count / total) * 100) : 0;
            var fillClass = star === 5 ? 'green' : (star <= 2 ? 'orange' : '');
            html +=
                '<div class="bar-row">' +
                    '<div class="label">' + star + ' star</div>' +
                    '<div class="track"><div class="fill ' + fillClass + '" style="width:' + pct + '%"></div></div>' +
                    '<div class="pct">' + pct + '%</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function renderVendors(reviews) {
        var container = document.getElementById('vendorList');
        if (!reviews.length) {
            container.innerHTML = '<p class="empty-note">No vendors yet.</p>';
            return;
        }

        var dishes = loadDishes();
        var dishVendor = {};
        dishes.forEach(function(d) { dishVendor[d.id] = d.vendor || 'Unknown'; });

        var map = {};
        reviews.forEach(function(r) {
            var vendor = dishVendor[r.dishId];
            if (!vendor) return;
            if (!map[vendor]) map[vendor] = { sum: 0, count: 0 };
            map[vendor].sum += r.rating;
            map[vendor].count += 1;
        });

        var vendors = Object.keys(map).map(function(name) {
            return {
                name: name,
                avg: map[name].sum / map[name].count,
                count: map[name].count
            };
        });
        vendors.sort(function(a, b) { return b.avg - a.avg; });

        if (!vendors.length) {
            container.innerHTML = '<p class="empty-note">No vendors with reviews yet.</p>';
            return;
        }

        var html = '';
        vendors.forEach(function(v) {
            var stars = '★'.repeat(Math.round(v.avg));
            html +=
                '<div class="vendor-row">' +
                    '<span class="vname">' + escapeHtml(v.name) + '</span>' +
                    '<span class="vright">' +
                        '<span class="vstars">' + stars + ' ' + v.avg.toFixed(1) + '</span>' +
                        '<span class="vcount">' + v.count + ' review' + (v.count === 1 ? '' : 's') + '</span>' +
                    '</span>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    // ============================================================
    // UTILITIES
    // ============================================================
    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function exportReviews() {
        var reviews = loadReviews();
        var blob = new Blob([JSON.stringify(reviews, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'dish-reviews.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function clearAllReviews() {
        if (!confirm('Delete ALL reviews? This cannot be undone.')) return;
        saveReviews([]);
        cancelEdit();
        renderAll();
    }

    // ============================================================
    // MAIN RENDER
    // ============================================================
    function renderAll() {
        var reviews = loadReviews();
        populateDishDropdown();
        renderKPIs(reviews);
        renderReviewsList(reviews);
        renderTopDishes(reviews);
        renderActivity(reviews);
        renderRatingBars(reviews);
        renderVendors(reviews);
    }

    // ============================================================
    // INIT
    // ============================================================
    initStarInput();
    renderAll();

    // keep menu dropdown in sync if menu changes in another tab
    window.addEventListener('storage', function(e) {
        if (e.key === DISH_KEY || e.key === REVIEW_KEY) renderAll();
    });
</script>

</body>
</html>

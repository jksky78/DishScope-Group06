<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <header>
        <h1>DishScope</h1>
    </header>
</head>
<body class="change-password-page">

    <div class="password-container">
        <h2>Change Password</h2>
        <p class="subtitle">Update your account password securely.</p>
        
        <form>
            <div class="input-group">
                <label for="current-password">Current Password</label>
                <input type="password" id="current-password" name="current-password" value="" required>
            </div>
            
            <div class="input-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password" value="" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password" value="" required>
            </div>

            <button type="submit" class="update-btn">Update Password</button>
        </form>
    </div>

</body>
</html>

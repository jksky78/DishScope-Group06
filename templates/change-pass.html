<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <header>
        <h1>DishScope</h1>
    </header>
</head>
<body>

    <div class="password-container">
        <h2>Change Password</h2>
        <p class="subtitle">Update your account password securely.</p>
        
        <form method="POST" action="/reset-password">
            <div class="input-group-reset">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" value="" required>
            </div>

            <div class="input-group-reset">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" value="" required>
            </div>

            <button type="submit" class="update-btn">Update Password</button>
        </form>
    </div>

</body>
</html>
